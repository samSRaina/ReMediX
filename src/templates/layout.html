<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Drug Repurpose App{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='css/main.css') }}">
    {% block extra_styles %}{% endblock %}
</head>
<body>
    <div class="container">
        {% block content %}
        {% endblock %}
    </div>

    <script>
        document.getElementById('smileForm')?.addEventListener('submit', function(e) {
            e.preventDefault();
            const smileId = document.getElementById('smileId').value;
            const resultDiv = document.getElementById('result');
            const outputDiv = document.getElementById('smileOutput');

            outputDiv.textContent = smileId;
            resultDiv.style.display = 'block';
        });
    </script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
